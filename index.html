<!-- Trigger Vercel deploy -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>jbpark.design</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="stylesheet" href="style.css?v=152">
</head>
<body class="coming-soon-body">

  <main class="coming-soon">
    <h1 class="coming-soon-headline">Good things ahead</h1>
    <div class="coming-soon-icons">
      <div class="lottie-canvas coming-soon-icon" data-src="assets/lotties/rivian-assistant/animation.json"></div>
      <div class="lottie-canvas coming-soon-icon" data-src="assets/lotties/joyful-utilities/animation.json"></div>
      <div class="lottie-canvas coming-soon-icon" data-src="assets/lotties/security/animation.json"></div>
      <div class="lottie-canvas coming-soon-icon" data-src="assets/lotties/energy/animation.json"></div>
      <div class="lottie-canvas coming-soon-icon" data-src="assets/lotties/archive/animation.json"></div>
    </div>
  </main>

  <script src="assets/js/lottie.min.js"></script>
  <script>
    document.querySelectorAll('.lottie-canvas').forEach(container => {
      lottie.loadAnimation({
        container,
        renderer: 'svg',
        autoplay: true,
        loop: true,
        path: container.dataset.src,
      });
    });
  </script>

</body>
</html>
